<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2e5fa3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="36" ry="36" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="184" height="184" rx="30" ry="30"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Accent bar at bottom -->
  <rect x="32" y="162" width="136" height="4" rx="2" fill="url(#accent)" opacity="0.85"/>

  <!-- PMS text -->
  <text x="100" y="122"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="64"
        font-weight="800"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-1">PMS</text>

  <!-- Subtitle -->
  <text x="100" y="148"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="13"
        font-weight="500"
        fill="rgba(255,255,255,0.55)"
        text-anchor="middle"
        letter-spacing="3">PROJECT MGMT</text>
</svg>
