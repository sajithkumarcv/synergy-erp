   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
 
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="description" content="PMS - Project Management System" />

      manifest.json provides metadata used when your web app is installed on a

      Notice the use of %PUBLIC_URL% in the tags above.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>PMS</title>

    <!-- ══ Branded boot loader (instant paint, before the JS bundle) ══
         Themed at runtime by branding.js applyBrand() via CSS vars, then
         faded out by index.js once React has mounted. Neutral fallback
         colors here so it looks right even before config.json loads. -->
    <style>
      #app-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(80% 60% at 50% 38%, color-mix(in srgb, var(--brand-panel-b, #24507f) 42%, transparent), transparent 70%),
          linear-gradient(160deg, var(--brand-panel-a, #0d1c36), color-mix(in srgb, var(--brand-panel-a, #0d1c36) 55%, #000));
        transition: opacity .55s ease, visibility .55s;
      }
      #app-loader.al-hide { opacity: 0; visibility: hidden; }
      .al-inner { display: flex; flex-direction: column; align-items: center; gap: 28px; }
      .al-orbit { position: relative; width: 128px; height: 128px; }
      .al-orbit .al-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; animation: alSpin 1.5s cubic-bezier(.6,.15,.35,.85) infinite; }
      .al-orbit .al-r1 { border-top-color: var(--brand-f1, #2e6fd0); border-right-color: var(--brand-f1, #2e6fd0); }
      .al-orbit .al-r2 { inset: 15px; border-bottom-color: var(--brand-f3, #8fb2e6); border-left-color: var(--brand-f3, #8fb2e6); animation-duration: 2s; animation-direction: reverse; }
      .al-orbit .al-r3 { inset: 30px; border-top-color: var(--brand-f4, #12305c); border-right-color: var(--brand-f4, #12305c); animation-duration: 2.6s; }
      .al-core {
        position: absolute; inset: 41px; border-radius: 22px; display: grid; place-items: center; overflow: hidden;
        font-weight: 800; font-size: 22px; letter-spacing: -.03em; color: var(--brand-title, #16305a);
        background: linear-gradient(145deg, #fff, #e9eef6);
        box-shadow: 0 10px 26px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.9);
        animation: alBreathe 2.2s ease-in-out infinite;
      }
      .al-core img { max-width: 78%; max-height: 78%; object-fit: contain; }
      .al-name { color: #fff; font-weight: 700; font-size: 17px; letter-spacing: -.01em; text-align: center; }
      .al-status {
        margin-top: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; letter-spacing: .16em; text-transform: uppercase; text-align: center;
        color: color-mix(in srgb, var(--brand-panel-glow, #5f95e0) 85%, #fff);
      }
      .al-bar { width: 190px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,.14); margin: 14px auto 0; }
      .al-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, var(--brand-f1, #2e6fd0), var(--brand-f3, #8fb2e6)); animation: alSweep 1.4s ease-in-out infinite; }
      @keyframes alSpin   { to { transform: rotate(360deg); } }
      @keyframes alBreathe{ 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.06);} }
      @keyframes alSweep  { 0%{ transform: translateX(-120%);} 100%{ transform: translateX(360%);} }
      @media (prefers-reduced-motion: reduce) { #app-loader * { animation: none !important; } }
    </style>
    <script>
      // Apply persisted login theme before paint (avoids a flash).
      try { var t = localStorage.getItem('erp_login_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="al-inner">
        <div class="al-orbit">
          <div class="al-ring al-r1"></div>
          <div class="al-ring al-r2"></div>
          <div class="al-ring al-r3"></div>
          <div class="al-core" id="al-core">P</div>
        </div>
        <div>
          <div class="al-name" id="al-name">Loading…</div>
          <div class="al-status" id="al-status">Preparing your workspace</div>
          <div class="al-bar"><i></i></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
